#############################################
# Quantumult X Optimized v2
# Updated: 2026-08-29
# Target apps: WeChat / QQ / Alipay / Taobao / JD / Bilibili
# TikTok / YouTube / Spotify / Instagram / X / AI apps / GitHub
#
# Design goals:
# 1. Keep domestic apps and Tencent games stable.
# 2. Use maintained remote ad rules instead of huge hard-coded lists.
# 3. Separate AI / streaming / social / development routing.
# 4. Do not globally block UDP/443; preserve HTTP/3 compatibility.
#############################################

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
profile_img_url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/author/fmz200-01.png
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
excluded_routes=239.255.255.250/32
fallback_udp_policy=reject

# Keep sensitive domestic services out of proxy/fake-IP handling where possible.
dns_exclusion_list=*.qq.com,*.tencent.com,*.gtimg.com,*.gtimg.cn,*.qpic.cn,*.qcloud.com,*.myqcloud.com,*.anticheatexpert.com,*.alipay.com,*.taobao.com,*.tmall.com,*.jd.com,*.bilibili.com,*.apple.com,*.icloud.com
geo_location_checker=http://ip-api.com/json/?lang=zh-CN,https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/scripts/server_location.js

# Intentionally no udp_drop_list=443.
# YouTube / TikTok / Spotify can depend on QUIC/HTTP3.

