name: Inspect ONE upstream Loon plugin
on:
  push:
    paths:
      - .github/workflows/inspect-one-upstream.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch source of referenced Loon runtime (do not execute)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 --output /tmp/loon.js 'https://one-api.zzxu.de/one/loon.js'
          bytes=$(wc -c < /tmp/loon.js)
          echo "ONE_RUNTIME_BYTES=$bytes"
          test "$bytes" -gt 0
          test "$bytes" -le 20000
          echo ONE_RUNTIME_BASE64_BEGIN
          base64 -w0 /tmp/loon.js
          echo
          echo ONE_RUNTIME_BASE64_END
