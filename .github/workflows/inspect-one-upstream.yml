name: Inspect ONE upstream Loon plugin
on:
  push:
    paths:
      - .github/workflows/inspect-one-upstream.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect upstream status and redirect without executing plugin
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header /tmp/hdr --connect-timeout 12 --max-time 30 --output /tmp/body 'https://one-api.zzxu.de/one/one.lpx'
          echo ONE_RESPONSE_HEADERS_BEGIN
          cat /tmp/hdr
          echo ONE_RESPONSE_HEADERS_END
          bytes=$(wc -c < /tmp/body)
          echo "ONE_BODY_BYTES=$bytes"
          if [ "$bytes" -gt 0 ] && [ "$bytes" -lt 100000 ]; then
            echo ONE_BODY_BASE64_BEGIN
            base64 -w0 /tmp/body
            echo
            echo ONE_BODY_BASE64_END
          fi
